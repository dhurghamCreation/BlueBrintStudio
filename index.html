<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>BluePrint Studio — Color & Design Buildings</title>
<style>
  :root{
    --navy:#16233F;
    --navy-2:#1E2F52;
    --blue-line:#4A7FB5;
    --brass:#D4A24E;
    --paper:#F6F3EC;
    --paper-2:#EDE8DC;
    --ink:#22252B;
    --coral:#FF6B5B;
    --ok:#4C7A5E;
    --radius:18px;
    --shadow: 0 10px 30px rgba(15,25,45,.18);
    --gold:#FFD700;
    --rose:#E91E63;
    --teal:#009688;
    --purple:#9C27B0;
    --orange:#FF9800;
    --lime:#8BC34A;
    --cyan:#00BCD4;
    --indigo:#3F51B5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    background:#0B1220;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    color:var(--ink);
  }
  .display{
    font-family:'Segoe UI',-apple-system,Arial,sans-serif;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .device{
    width:390px;
    height:844px;
    max-height:96vh;
    background:#000;
    border-radius:46px;
    padding:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    position:relative;
  }
  .screen{
    width:100%;height:100%;
    background:var(--paper);
    border-radius:32px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:50;
  }
  #splash{
    position:absolute;inset:0;z-index:100;
    background:radial-gradient(circle at 50% 30%, var(--navy-2), var(--navy) 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--paper);
    transition:opacity .5s ease;
  }
  .compass{width:96px;height:96px;margin-bottom:22px;animation:spin 2.2s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #splash h1{font-size:22px;margin:0 0 4px;letter-spacing:.12em;}
  #splash p{font-size:11px;opacity:.7;letter-spacing:.18em;margin:0 0 30px;text-transform:uppercase;}
  .loadbar{width:180px;height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;}
  .loadbar>div{height:100%;width:0%;background:var(--brass);border-radius:6px;animation:load 1.8s ease forwards;}
  @keyframes load{to{width:100%;}}
  .loadtip{margin-top:10px;font-size:10px;opacity:.55;letter-spacing:.08em;}
  #app{display:flex;flex-direction:column;height:100%;opacity:0;transition:opacity .4s ease;}
  #app.ready{opacity:1;}
  header.topbar{padding:20px 20px 14px;background:var(--navy);color:var(--paper);position:relative;flex-shrink:0;}
  header.topbar .eyebrow{font-size:10px;letter-spacing:.2em;opacity:.6;text-transform:uppercase;}
  header.topbar h2{margin:2px 0 0;font-size:20px;letter-spacing:.02em;}
  header.topbar .sub{font-size:11px;opacity:.65;margin-top:3px;}
  header.topbar .back{position:absolute;left:16px;top:20px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:var(--paper);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s ease, transform .2s ease;}
  header.topbar .back:hover{background:rgba(255,255,255,.2);transform:scale(1.1);}
  header.topbar .back:active{transform:scale(.92);}
  header.topbar.blueprint-grid{background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);background-size:14px 14px;}
  main#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px;}
  main#content::-webkit-scrollbar{width:0;}
  nav.tabbar{display:flex;flex-shrink:0;background:#fff;border-top:1px solid #E4DFD3;padding:8px 4px 10px;}
  nav.tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:#9A9686;font-weight:600;letter-spacing:.02em;cursor:pointer;padding:4px 0;transition:color .2s ease, transform .2s ease;}
  nav.tabbar button:hover{color:var(--navy);transform:translateY(-1px);}
  nav.tabbar button .ic{font-size:18px;line-height:1;transition:transform .2s ease;}
  nav.tabbar button:hover .ic{transform:scale(1.15);}
  nav.tabbar button.active{color:var(--navy);}
  nav.tabbar button.active .ic{transform:translateY(-1px);}
  .section-pad{padding:16px 18px;}
  .card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 2px 10px rgba(20,30,50,.06);margin-bottom:14px;border:1px solid #ECE6D8;transition:box-shadow .2s ease;}
  .card:hover{box-shadow:0 4px 20px rgba(20,30,50,.12);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:700;letter-spacing:.02em;cursor:pointer;transition:all .2s ease;position:relative;overflow:hidden;}
  .btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.1);opacity:0;transition:opacity .2s ease;}
  .btn:hover::after{opacity:1;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,35,63,.25);}
  .btn:active{transform:scale(.95);box-shadow:0 2px 8px rgba(22,35,63,.15);}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn.ghost:hover{background:var(--navy);color:#fff;box-shadow:0 6px 20px rgba(22,35,63,.2);}
  .btn.ghost:active{background:var(--navy-2);}
  .btn.brass{background:var(--brass);color:#3A2A0E;}
  .btn.brass:hover{box-shadow:0 6px 20px rgba(212,162,78,.4);}
  .btn.coral{background:var(--coral);color:#fff;}
  .btn.coral:hover{box-shadow:0 6px 20px rgba(255,107,91,.4);}
  .btn.sm{padding:7px 12px;font-size:11px;border-radius:9px;}
  .btn.block{width:100%;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.04em;background:var(--paper-2);color:var(--navy);text-transform:uppercase;}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:all .25s ease;z-index:200;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  h3.section-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8B876F;margin:0 0 10px;}
  .mode-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid #ECE6D8;box-shadow:0 2px 10px rgba(20,30,50,.06);cursor:pointer;transition:all .2s ease;}
  .mode-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,30,50,.12);border-color:var(--brass);}
  .mode-card:active{transform:scale(.98);}
  .mode-card .emoji{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;transition:transform .2s ease;}
  .mode-card:hover .emoji{transform:scale(1.1) rotate(-5deg);}
  .mode-card h4{margin:0 0 3px;font-size:14.5px;}
  .mode-card p{margin:0;font-size:11.5px;color:#8B876F;}
  .streak-banner{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;transition:box-shadow .2s ease;}
  .streak-banner:hover{box-shadow:0 6px 25px rgba(22,35,63,.3);}
  .streak-banner .num{font-size:26px;font-weight:800;}
  .streak-banner .lbl{font-size:10px;opacity:.7;letter-spacing:.1em;text-transform:uppercase;}
  .tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tpl-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ECE6D8;cursor:pointer;box-shadow:0 2px 8px rgba(20,30,50,.05);transition:all .2s ease;}
  .tpl-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(20,30,50,.15);border-color:var(--brass);}
  .tpl-card:active{transform:scale(.97);}
  .tpl-card .thumb{background:var(--paper-2);display:flex;align-items:center;justify-content:center;height:110px;transition:background .2s ease;}
  .tpl-card:hover .thumb{background:var(--paper);}
  .tpl-card .thumb svg{width:80%;height:80%;}
  .tpl-card .meta{padding:8px 10px 10px;}
  .tpl-card .meta h5{margin:0 0 2px;font-size:12px;}
  .tpl-card .meta span{font-size:9.5px;color:#9A9686;}
  .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #E4DFD3;border-radius:14px;padding:10px 14px;margin-bottom:16px;transition:border-color .2s ease, box-shadow .2s ease;}
  .search-box:focus-within{border-color:var(--brass);box-shadow:0 0 0 3px rgba(212,162,78,.15);}
  .search-box input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent;}
  .canvas-wrap{background:var(--paper);background-image:linear-gradient(#E4DFD3 1px, transparent 1px),linear-gradient(90deg, #E4DFD3 1px, transparent 1px);background-size:16px 16px;display:flex;align-items:center;justify-content:center;padding:14px;}
  .canvas-wrap svg{width:100%;max-width:280px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.08));}
  .region{stroke:#22252B;stroke-width:2;cursor:pointer;transition:fill .15s ease, stroke .2s ease;}
  .region:hover{stroke:var(--brass);stroke-width:2.5;}
  .region.locked-empty{fill:#fff;}
  .num-label{font-size:13px;font-weight:800;fill:#22252B;pointer-events:none;font-family:Arial,sans-serif;}
  .num-label.solved{opacity:0;}
  .shake{animation:shakeit .3s ease;}
  @keyframes shakeit{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .palette-row{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:#fff;border-top:1px solid #ECE6D8;scrollbar-width:thin;}
  .palette-row::-webkit-scrollbar{height:4px;}
  .palette-row::-webkit-scrollbar-thumb{background:#D9D3C2;border-radius:4px;}
  .swatch{width:42px;height:42px;border-radius:10px;flex-shrink:0;position:relative;cursor:pointer;border:2px solid rgba(0,0,0,.08);display:flex;align-items:flex-end;justify-content:center;transition:all .2s ease;}
  .swatch:hover{transform:scale(1.12);border-color:var(--navy);box-shadow:0 3px 10px rgba(0,0,0,.15);}
  .swatch.selected{outline:3px solid var(--navy);outline-offset:2px;transform:scale(1.08);}
  .swatch .swnum{background:rgba(255,255,255,.85);border-radius:6px 6px 0 0;font-size:9px;font-weight:800;padding:1px 4px;color:#22252B;}
  .toolbar-row{display:flex;gap:8px;padding:10px 16px;background:#fff;overflow-x:auto;border-top:1px solid #ECE6D8;scrollbar-width:thin;}
  .toolbar-row::-webkit-scrollbar{height:4px;}
  .toolbar-row::-webkit-scrollbar-thumb{background:#D9D3C2;border-radius:4px;}
  .tool-btn{flex-shrink:0;background:var(--paper-2);border:none;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:700;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .2s ease;}
  .tool-btn:hover{background:var(--navy);color:#fff;transform:translateY(-2px);box-shadow:0 4px 12px rgba(22,35,63,.2);}
  .tool-btn:active{transform:scale(.95);}
  .tool-btn.active{background:var(--navy);color:#fff;}
  .tool-btn.active:hover{background:var(--navy-2);}
  .mode-toggle{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 16px;border-top:1px solid #ECE6D8;font-size:12px;}
  .switch{position:relative;width:40px;height:22px;background:#D9D3C2;border-radius:20px;cursor:pointer;flex-shrink:0;transition:background .2s ease;}
  .switch:hover{background:#C7C2B0;}
  .switch.on{background:var(--ok);}
  .switch.on:hover{background:#3D6A50;}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s,transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch:hover::after{transform:scale(1.1);}
  .switch.on::after{left:20px;}
  .studio-canvas-wrap{background:#fff;background-image:linear-gradient(#EDE8DC 1px,transparent 1px),linear-gradient(90deg,#EDE8DC 1px,transparent 1px);background-size:20px 20px;}
  .shape-el{cursor:grab;stroke:#22252B;stroke-width:1.6;transition:stroke .2s ease, stroke-width .2s ease;}
  .shape-el:hover{stroke:var(--brass);stroke-width:2.5;}
  .shape-el.selected{stroke:var(--coral);stroke-width:3;stroke-dasharray:5 3;}
  .shape-el.dragging{cursor:grabbing;stroke:var(--gold);stroke-width:3;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));}
  .draw-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .draw-item{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ECE6D8;cursor:pointer;transition:all .2s ease;}
  .draw-item:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(20,30,50,.15);border-color:var(--brass);}
  .draw-item:active{transform:scale(.97);}
  .draw-item img{width:100%;height:120px;object-fit:cover;display:block;background:var(--paper-2);}
  .draw-item .meta{padding:8px 10px;}
  .draw-item .meta h5{margin:0 0 2px;font-size:11.5px;}
  .draw-item .meta span{font-size:9px;color:#9A9686;}
  .empty-state{text-align:center;padding:50px 20px;color:#9A9686;}
  .empty-state .big{font-size:38px;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
  .cal-grid .dow{font-size:9.5px;color:#9A9686;font-weight:700;padding-bottom:4px;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:11.5px;background:#F3EFE4;color:#B4AF9C;position:relative;transition:all .2s ease;}
  .cal-day:hover{background:#EDE8DC;}
  .cal-day.visited{background:var(--navy);color:#fff;font-weight:700;}
  .cal-day.visited:hover{background:var(--navy-2);}
  .cal-day.today{outline:2px solid var(--brass);}
  .cal-day.blank{background:transparent;}
  .stat-row{display:flex;gap:10px;margin-bottom:16px;}
  .stat-box{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center;border:1px solid #ECE6D8;transition:all .2s ease;}
  .stat-box:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(20,30,50,.1);}
  .stat-box .n{font-size:20px;font-weight:800;color:var(--navy);}
  .stat-box .l{font-size:9px;color:#9A9686;text-transform:uppercase;letter-spacing:.06em;}
  .ach-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid #ECE6D8;transition:all .2s ease;}
  .ach-card:hover{transform:translateX(4px);}
  .ach-card.locked{opacity:.45;}
  .ach-ic{width:44px;height:44px;border-radius:12px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:all .3s ease;}
  .ach-card.unlocked .ach-ic{background:var(--brass);}
  .ach-card.unlocked:hover .ach-ic{transform:rotate(360deg) scale(1.1);}
  .ach-info h5{margin:0 0 2px;font-size:12.5px;}
  .ach-info p{margin:0;font-size:10.5px;color:#9A9686;}
  .ach-bar{height:5px;background:#EDE8DC;border-radius:5px;margin-top:5px;overflow:hidden;}
  .ach-bar>div{height:100%;background:var(--ok);transition:width .5s ease;}
  .news-card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid #ECE6D8;border-left:4px solid var(--brass);transition:all .2s ease;}
  .news-card:hover{transform:translateX(4px);box-shadow:0 4px 15px rgba(20,30,50,.1);}
  .news-card .date{font-size:9.5px;color:#9A9686;text-transform:uppercase;letter-spacing:.06em;}
  .news-card h5{margin:4px 0 4px;font-size:13.5px;}
  .news-card p{margin:0;font-size:12px;color:#5C5848;line-height:1.4;}
  .list-row{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:14px 16px;border-bottom:1px solid #F1EDE1;font-size:13px;cursor:pointer;transition:all .15s ease;}
  .list-row:hover{background:var(--paper-2);padding-left:20px;}
  .list-row:first-child{border-radius:14px 14px 0 0;}
  .list-row:last-child{border-radius:0 0 14px 14px;border-bottom:none;}
  .list-group{border:1px solid #ECE6D8;border-radius:14px;overflow:hidden;margin-bottom:16px;}
  .list-row .chev{color:#C7C2B0;transition:transform .2s ease;}
  .list-row:hover .chev{transform:translateX(3px);}
  .legal-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .legal-tabs button{flex:1;padding:9px 4px;font-size:11px;font-weight:700;border-radius:10px;border:none;background:#EDE8DC;color:var(--navy);cursor:pointer;transition:all .2s ease;}
  .legal-tabs button:hover{background:var(--navy);color:#fff;transform:translateY(-1px);}
  .legal-tabs button.active{background:var(--navy);color:#fff;}
  .legal-body{font-size:12.5px;line-height:1.6;color:#3A3A34;}
  .legal-body h4{font-size:13px;margin:14px 0 4px;color:var(--navy);}
  .star-row{display:flex;gap:6px;justify-content:center;margin:14px 0;}
  .star{font-size:30px;color:#DDD6C4;cursor:pointer;transition:all .2s ease;}
  .star:hover{transform:scale(1.2);color:#D4A24E;}
  .star.filled{color:var(--brass);}
  textarea.review-input{width:100%;border:1.5px solid #E4DFD3;border-radius:12px;padding:10px;font-size:12.5px;min-height:80px;font-family:inherit;resize:none;transition:border-color .2s ease;}
  textarea.review-input:focus{border-color:var(--brass);outline:none;box-shadow:0 0 0 3px rgba(212,162,78,.15);}
  .consent-box{display:flex;gap:10px;align-items:flex-start;background:var(--paper-2);padding:12px;border-radius:12px;margin-top:10px;font-size:11.5px;transition:background .2s ease;}
  .consent-box:hover{background:var(--paper);}
  .consent-box input{margin-top:2px;}
  .disclaimer{font-size:10px;color:#9A9686;margin-top:16px;line-height:1.5;text-align:center;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeInUp .3s ease forwards;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .pulse{animation:pulse 1.5s ease infinite;}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 5px rgba(212,162,78,.3));}50%{filter:drop-shadow(0 0 15px rgba(212,162,78,.6));}}
  .glow{animation:glow 2s ease infinite;}
  .fa-ic{font-size:18px;line-height:1;}
  .mode-card .emoji .fa-3x{font-size:28px;}

  /* ---------- Custom Confirm Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;z-index:9999;
    background:rgba(11,18,32,.7);
    display:flex;align-items:center;justify-content:center;
    animation:modalFadeIn .25s ease;
    backdrop-filter:blur(4px);
  }
  @keyframes modalFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalSlideUp{from{opacity:0;transform:translateY(30px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal-box{
    background:var(--paper);border-radius:22px;padding:0;
    width:300px;max-width:88%;overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,.4);
    animation:modalSlideUp .3s ease;
  }
  .modal-header{
    background:var(--navy);color:var(--paper);padding:18px 20px 14px;
    text-align:center;
  }
  .modal-header .modal-icon{font-size:32px;margin-bottom:6px;display:block;}
  .modal-header h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em;}
  .modal-body{
    padding:20px 20px 24px;text-align:center;font-size:13px;color:#5C5848;line-height:1.5;
  }
  .modal-actions{
    display:flex;gap:10px;padding:0 20px 20px;
  }
  .modal-actions button{
    flex:1;padding:11px 0;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;
    transition:all .2s ease;
  }
  .modal-actions button:hover{transform:translateY(-2px);}
  .modal-actions button:active{transform:scale(.96);}
  .modal-btn-cancel{
    background:var(--paper-2);color:var(--navy);
  }
  .modal-btn-cancel:hover{background:#DDD6C4;box-shadow:0 4px 12px rgba(0,0,0,.1);}
  .modal-btn-confirm{

  set(k, v){ try{ localStorage.setItem('bp_'+k, JSON.stringify(v)); }catch(e){} }

function saveAll(){

let actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq, dur, type='sine', vol=0.16, delay=0){
  if(!state.settings.sound) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const t0 = ctx.currentTime + delay;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+dur);
}
const SFX = {
  tap: ()=>tone(520,.05,'sine',.12),
  nav: ()=>tone(440,.04,'sine',.10),
  correct: ()=>{tone(660,.1,'triangle',.16); tone(880,.12,'triangle',.14,.08);},
  wrong: ()=>tone(160,.16,'square',.12),
  save: ()=>{tone(500,.08,'sine',.14); tone(700,.1,'sine',.14,.09);},
  unlock: ()=>{tone(523,.09,'triangle',.16); tone(659,.09,'triangle',.16,.09); tone(784,.16,'triangle',.18,.18);},
  del: ()=>tone(220,.09,'sawtooth',.1)
};
document.addEventListener('pointerdown', ()=>ensureAudio(), {once:true});

let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1900);
}

/* ---------- Custom Confirm Dialog ---------- */
function showConfirm(msg, icon='<i class="fas fa-exclamation-triangle"></i>', btnClass='danger'){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-icon">${icon}</span>
          <h3>Confirm</h3>
        </div>
        <div class="modal-body">${msg}</div>
        <div class="modal-actions">
          <button class="modal-btn-cancel" id="modalCancel">Cancel</button>
          <button class="modal-btn-confirm ${btnClass}" id="modalConfirm">Yes, Continue</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#modalCancel').addEventListener('click', ()=>{ overlay.remove(); resolve(false); });
    overlay.querySelector('#modalConfirm').addEventListener('click', ()=>{ overlay.remove(); resolve(true); });
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ overlay.remove(); resolve(false); } });
  });
}

function rect(x,y,w,h,num){ return {shape:'rect', x,y,w,h, num, cx:x+w/2, cy:y+h/2}; }
function poly(pts,num){
  const arr = pts.trim().split(/\s+/).map(p=>p.split(',').map(Number));
  const cx = arr.reduce((s,p)=>s+p[0],0)/arr.length;
  const cy = arr.reduce((s,p)=>s+p[1],0)/arr.length;
  return {shape:'polygon', points:pts, num, cx, cy};
}
function circ(cx,cy,r,num){ return {shape:'circle', cx, cy, r, num}; }

function newShapeEl(type){
  const id = 's'+Math.random().toString(36).slice(2,9);
  const base = { id, fill:'#F1E7D0' };
  switch(type){
    case 'wall': return {...base, shape:'rect', x:70+Math.random()*40, y:150+Math.random()*40, w:160, h:150};
    case 'roof': return {...base, shape:'polygon', points:'60,150 150,70 240,150', fill:'#C0553D'};
    case 'door': return {...base, shape:'rect', x:130+Math.random()*20, y:230+Math.random()*40, w:40, h:80, fill:'#D4A24E'};
    case 'window': return {...base, shape:'rect', x:90+Math.random()*100, y:180+Math.random()*40, w:36, h:36, fill:'#6FA8DC'};
    case 'roundwin': return {...base, shape:'circle', cx:150+Math.random()*40, cy:190, r:22, fill:'#6FA8DC'};
    case 'chimney': return {...base, shape:'rect', x:190+Math.random()*30, y:90, w:22, h:70, fill:'#2B2B2B'};
    case 'tree': return {...base, shape:'circle', cx:40+Math.random()*20, cy:300, r:26, fill:'#4C7A5E'};
    case 'ground': return {...base, shape:'rect', x:0, y:340, w:300, h:60, fill:'#4C7A5E'};
    case 'sun': return {...base, shape:'circle', cx:40+Math.random()*20, cy:40+Math.random()*20, r:24, fill:'#FFD700'};
    case 'cloud': return {...base, shape:'circle', cx:200+Math.random()*40, cy:50+Math.random()*20, r:20, fill:'#87CEEB'};
    case 'fence': return {...base, shape:'rect', x:0, y:290, w:300, h:10, fill:'#8B4513'};
    case 'path': return {...base, shape:'rect', x:120, y:280, w:60, h:60, fill:'#E4C9A0'};
    case 'flag': return {...base, shape:'polygon', points:'150,80 150,50 180,65', fill:'#FF6B5B'};
    case 'pool': return {...base, shape:'rect', x:90, y:290, w:120, h:50, fill:'#6FA8DC'};
    case 'lamp': return {...base, shape:'rect', x:50, y:280, w:10, h:30, fill:'#2B2B2B'};
    default: return {...base, shape:'rect', x:100,y:100,w:60,h:60};
  }
}

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(a.progress() >= a.goal && !state.achievementsUnlocked.includes(a.id)){
      state.achievementsUnlocked.push(a.id);
      saveAll();
      SFX.unlock();
      toast('<i class="fas fa-trophy"></i> Achievement unlocked: '+a.name);
    }
  });
}

function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }
function recordVisit(){
  const t = todayStr();
  if(!state.visitDates.includes(t)){ state.visitDates.push(t); saveAll(); }
}
function currentStreak(){
  const set = new Set(state.visitDates);
  let streak = 0;
  let d = new Date();
  if(!set.has(todayStr(d))) d.setDate(d.getDate()-1);
  while(set.has(todayStr(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function longestStreak(){
  const dates = [...state.visitDates].sort();
  let longest=0, run=0, prev=null;
  dates.forEach(ds=>{
    const d = new Date(ds);
    if(prev){ const diff = Math.round((d-prev)/86400000); run = diff===1 ? run+1 : 1; } else run = 1;
    longest = Math.max(longest, run); prev = d;
  });
  return longest;
}

  setActiveTab(tab); render(); contentEl.scrollTop = 0;
}

function render(){
  switch(state.screen){
    case 'draw-hub': return renderDrawHub();
    case 'color': return renderColorScreen(state.screenData);
    case 'studio': return renderStudioScreen();
    case 'sketch': return renderSketchScreen();
    case 'drawings-list': return renderDrawingsList();
    case 'search-list': return renderSearchList();
    case 'calendar-view': return renderCalendar();
    case 'trophy-view': return renderTrophy();
    case 'more-menu': return renderMoreMenu();

function templateCardHTML(tpl){ return `<div class="tpl-card" style="margin-bottom:14px;"><div class="thumb">${renderTemplateThumb(tpl)}</div><div class="meta"><h5>${tpl.name}</h5><span>${tpl.regions.length} regions to color</span></div></div>`; }
function renderTemplateThumb(tpl){ const shapes = tpl.regions.map(r=>shapeSVG(r,'#fff','none')).join(''); return `<svg viewBox="${tpl.viewBox}">${shapes}</svg>`; }
function shapeSVG(r,fill,stroke){
  const st = stroke==='none' ? 'stroke="none"' : `stroke="${stroke||'#22252B'}" stroke-width="2"`;
  if(r.shape==='rect') return `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${fill}" ${st}/>`;
  if(r.shape==='polygon') return `<polygon points="${r.points}" fill="${fill}" ${st}/>`;
  if(r.shape==='circle') return `<circle cx="${r.cx}" cy="${r.cy}" r="${r.r}" fill="${fill}" ${st}/>`;
  return '';
}

function openColorTemplate(id){
  const tpl = TEMPLATES.find(t=>t.id===id);

}

function renderColorScreen(data){
  const {tpl, fills} = data;
  setHeader('Color by Number', tpl.name, 'Tap the matching number to fill it', true);
  const svgShapes = tpl.regions.map((r,i)=>{
    const filled = fills[i]; const fillColor = filled ? colorOf(filled) : '#ffffff';
    const labelClass = filled ? 'num-label solved' : 'num-label';
    let el = '';
    if(r.shape==='rect') el = `<rect data-i="${i}" class="region ${filled?'':'locked-empty'}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${fillColor}"/>`;
    else if(r.shape==='polygon') el = `<polygon data-i="${i}" class="region ${filled?'':'locked-empty'}" points="${r.points}" fill="${fillColor}"/>`;
    else if(r.shape==='circle') el = `<circle data-i="${i}" class="region ${filled?'':'locked-empty'}" cx="${r.cx}" cy="${r.cy}" r="${r.r}" fill="${fillColor}"/>`;
    return el + `<text x="${r.cx}" y="${r.cy+4}" text-anchor="middle" class="${labelClass}">${r.num}</text>`;
  }).join('');
  const usedNums = [...new Set(tpl.regions.map(r=>r.num))].sort((a,b)=>a-b);
  const swatches = usedNums.map(n=>{ const p = PALETTE.find(p=>p.n===n); return `<div class="swatch" data-num="${n}" style="background:${p.hex};"><span class="swnum">${n}</span></div>`; }).join('');
  const allDone = fills.every(f=>f!==null);
  contentEl.innerHTML = `<div class="canvas-wrap" id="canvasWrap"><svg viewBox="${tpl.viewBox}" id="tplSvg">${svgShapes}</svg></div>`;
  const paletteBar = document.createElement('div'); paletteBar.className = 'palette-row'; paletteBar.innerHTML = swatches; contentEl.appendChild(paletteBar);
  const modeBar = document.createElement('div'); modeBar.className = 'mode-toggle';
  modeBar.innerHTML = `<span>Guided mode (match numbers)</span><div class="switch ${state.settings.guided?'on':''}" id="guidedSwitch"></div>`;
  contentEl.appendChild(modeBar);
  const actionBar = document.createElement('div'); actionBar.style.padding = '14px 16px 4px';
  actionBar.innerHTML = `<button class="btn block ${allDone?'brass':'ghost'}" id="finishBtn">${allDone? 'Save Finished Piece' : 'Save Progress'}</button>`;
  contentEl.appendChild(actionBar);
  let selectedNum = usedNums[0];
  function selectSwatch(n){ selectedNum = n; paletteBar.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected', Number(s.dataset.num)===n)); }
  selectSwatch(selectedNum);
  paletteBar.addEventListener('click', (e)=>{ const sw = e.target.closest('.swatch'); if(!sw) return; SFX.tap(); selectSwatch(Number(sw.dataset.num)); });
  modeBar.querySelector('#guidedSwitch').addEventListener('click', (e)=>{ state.settings.guided = !state.settings.guided; saveAll(); e.currentTarget.classList.toggle('on', state.settings.guided); toast(state.settings.guided ? 'Guided mode on' : 'Free mode on'); });
  const svg = contentEl.querySelector('#tplSvg');
  svg.addEventListener('click', (e)=>{
    const region = e.target.closest('.region'); if(!region) return;
    const i = Number(region.dataset.i); const r = tpl.regions[i];
    if(fills[i]) { SFX.tap(); return; }
    if(state.settings.guided && r.num !== selectedNum){ SFX.wrong(); region.classList.add('shake'); setTimeout(()=>region.classList.remove('shake'), 320); return; }
    fills[i] = selectedNum; region.setAttribute('fill', colorOf(selectedNum)); region.classList.remove('locked-empty');
    const lbl = svg.querySelectorAll('text')[i]; lbl.classList.add('solved'); SFX.correct();
    state.stats.totalFills++; LS.set(progressKeyFor(tpl.id), {fills}); saveAll(); checkAchievements();
    if(fills.every(f=>f!==null)){ finishBtnUpdate(true); state.stats.templatesCompleted++; saveAll(); checkAchievements(); toast('Building complete!'); }
  });
  function finishBtnUpdate(done){ const btn = contentEl.querySelector('#finishBtn'); btn.textContent = done ? 'Save Finished Piece' : 'Save Progress'; btn.className = 'btn block ' + (done ? 'brass':'ghost'); }
  contentEl.querySelector('#finishBtn').addEventListener('click', ()=>{ saveColoredDrawing(tpl, fills); });
}
function progressKeyFor(id){ return 'progress_'+id; }
function saveColoredDrawing(tpl, fills){
  const svgMarkup = buildStandaloneSVG(tpl, fills);
  svgToPngDataUrl(svgMarkup, 300, 400).then(url=>{
    state.drawings.unshift({id:'d'+Date.now(), type:'template', name:tpl.name, dataURL:url, date:todayStr()});
    state.stats.drawingsSaved++; saveAll(); checkAchievements(); SFX.save(); toast('Saved to My Art'); render();
  });
}
function buildStandaloneSVG(tpl, fills){ const shapes = tpl.regions.map((r,i)=>shapeSVG(r, fills[i]?colorOf(fills[i]):'#ffffff')).join(''); return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${tpl.viewBox}" width="300" height="400"><rect width="100%" height="100%" fill="#F6F3EC"/>${shapes}</svg>`; }
function svgToPngDataUrl(svgMarkup, w, h){
  return new Promise((resolve)=>{
    const svgBlob = new Blob([svgMarkup], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob); const img = new Image();
    img.onload = ()=>{ const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.fillStyle = '#F6F3EC'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h); URL.revokeObjectURL(url); resolve(canvas.toDataURL('image/png')); };
    img.onerror = ()=>resolve(null); img.src = url;
  });
}

function renderDrawingsList(){
  setHeader('My Art','My Drawings', state.drawings.length+' saved works', false);
  if(state.drawings.length===0){ contentEl.innerHTML = `<div class="empty-state"><div class="big"><i class="fas fa-images"></i></div><p>Nothing here yet.<br>Go color or design something!</p><button class="btn brass" id="goDrawBtn" style="margin-top:12px;">Start Drawing</button></div>`; contentEl.querySelector('#goDrawBtn').onclick = ()=>{ SFX.nav(); goTo('draw','draw-hub'); }; return; }
  contentEl.innerHTML = `<div class="section-pad"><div class="draw-grid">${state.drawings.map(d=>`<div class="draw-item" data-id="${d.id}"><img src="${d.dataURL||''}" alt="${d.name}"><div class="meta"><h5>${d.name}</h5><span>${d.date}</span></div></div>`).join('')}</div></div>`;
  contentEl.querySelectorAll('.draw-item').forEach(el=>{ el.addEventListener('click', async ()=>{ SFX.tap(); const d = state.drawings.find(x=>x.id===el.dataset.id); if(await showConfirm('Delete "'+d.name+'"? This cannot be undone.','<i class="fas fa-trash-alt"></i>','danger')){ state.drawings = state.drawings.filter(x=>x.id!==d.id); saveAll(); SFX.del(); renderDrawingsList(); } }); });
}

function renderSearchList(){
  setHeader('Search','Find a Sketch','Search buildings to color', false);
  contentEl.innerHTML = `<div class="section-pad"><div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Try castle, tower, nature, animal..."></div><div class="tpl-grid" id="tplGrid"></div></div>`;
  const grid = contentEl.querySelector('#tplGrid');
  function draw(list){ grid.innerHTML = list.map(t=>`<div class="tpl-card" data-id="${t.id}"><div class="thumb">${renderTemplateThumb(t)}</div><div class="meta"><h5>${t.name}</h5><span>${t.regions.length} regions</span></div></div>`).join('') || `<div class="empty-state" style="grid-column:1/3;"><div class="big"><i class="fas fa-search"></i></div><p>No sketches match that search.</p></div>`; grid.querySelectorAll('.tpl-card').forEach(c=>{ c.addEventListener('click', ()=>{ SFX.tap(); openColorTemplate(c.dataset.id); }); }); }
  draw(TEMPLATES);
  contentEl.querySelector('#searchInput').addEventListener('input', (e)=>{ const q = e.target.value.toLowerCase().trim(); draw(TEMPLATES.filter(t=> t.name.toLowerCase().includes(q) || t.tags.some(tag=>tag.includes(q)))); });
}

function renderCalendar(){
  const streak = currentStreak(), longest = longestStreak();
  setHeader('Calendar','Your Streak', 'Every visit lights up the day', false);
  const now = new Date(); const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1); const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = now.toLocaleString('default', {month:'long', year:'numeric'});
  const visitSet = new Set(state.visitDates);
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div class="cal-day blank"></div>';
  for(let d=1; d<=daysInMonth; d++){ const dateObj = new Date(year, month, d); const ds = todayStr(dateObj); const visited = visitSet.has(ds); const isToday = ds===todayStr(); cells += `<div class="cal-day ${visited?'visited':''} ${isToday?'today':''}">${d}</div>`; }
  contentEl.innerHTML = `<div class="section-pad"><div class="stat-row"><div class="stat-box"><div class="n">${streak}</div><div class="l">Current Streak</div></div><div class="stat-box"><div class="n">${longest}</div><div class="l">Longest Streak</div></div><div class="stat-box"><div class="n">${state.visitDates.length}</div><div class="l">Total Days</div></div></div><div class="card"><h3 class="section-title">${monthName}</h3><div class="cal-grid"><div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>${cells}</div></div></div>`;
}

function renderTrophy(){
  setHeader('Trophy Room','Achievements', state.achievementsUnlocked.length+' of '+ACHIEVEMENTS.length+' unlocked', false);
  contentEl.innerHTML = `<div class="section-pad"><div class="stat-row"><div class="stat-box"><div class="n">${currentStreak()}</div><div class="l">Streak</div></div><div class="stat-box"><div class="n">${state.stats.totalFills}</div><div class="l">Fills</div></div><div class="stat-box"><div class="n">${state.stats.templatesCompleted}</div><div class="l">Buildings</div></div></div><h3 class="section-title">Badges</h3>${ACHIEVEMENTS.map(a=>{ const unlocked = state.achievementsUnlocked.includes(a.id); const pct = Math.min(100, Math.round(100*a.progress()/a.goal)); return `<div class="ach-card ${unlocked?'unlocked':'locked'}"><div class="ach-ic">${unlocked ? a.ic : '<i class="fas fa-lock"></i>'}</div><div class="ach-info" style="flex:1;"><h5>${a.name}</h5><p>${a.desc}</p>${!unlocked ? `<div class="ach-bar"><div style="width:${pct}%;"></div></div>` : '<span class="pill" style="margin-top:4px;display:inline-block;">Unlocked</span>'}</div></div>`; }).join('')}</div>`;
}

function renderMoreMenu(){
  setHeader('BluePrint Studio','More','News, settings & legal', false);
  contentEl.innerHTML = `<div class="section-pad"><h3 class="section-title">Explore</h3><div class="list-group"><div class="list-row" data-go="news"><span><i class="fas fa-newspaper"></i> &nbsp; News & Updates</span><span class="chev">›</span></div></div><h3 class="section-title">App</h3><div class="list-group"><div class="list-row" data-go="settings"><span><i class="fas fa-cog"></i> &nbsp; Settings</span><span class="chev">›</span></div><div class="list-row" data-go="legal-terms"><span><i class="fas fa-file-alt"></i> &nbsp; Terms of Use</span><span class="chev">›</span></div><div class="list-row" data-go="legal-privacy"><span><i class="fas fa-lock"></i> &nbsp; Privacy & Consent</span><span class="chev">›</span></div><div class="list-row" data-go="legal-review"><span><i class="fas fa-star"></i> &nbsp; Rate & Review</span><span class="chev">›</span></div></div><div class="disclaimer">BluePrint Studio v2.0.0 &mdash; with drag, 60+ templates & 35 colors!<br>All data is stored only on this device.<br> Created by Dhurgham Alsaadi</div></div>`;
  contentEl.querySelectorAll('.list-row').forEach(r=>{ r.addEventListener('click', ()=>{ SFX.tap(); const go = r.dataset.go; if(go==='news') goTo('more','news'); else if(go==='settings') goTo('more','settings'); else if(go==='legal-terms') goTo('more','legal','terms'); else if(go==='legal-privacy') goTo('more','legal','privacy'); else if(go==='legal-review') goTo('more','legal','review'); }); });
}

function renderNews(){ setHeader('More','News & Updates',"What's new", true); contentEl.innerHTML = `<div class="section-pad">${NEWS.map(n=>`<div class="news-card"><div class="date">${n.date}</div><h5>${n.title}</h5><p>${n.body}</p></div>`).join('')}</div>`; }

function renderSettings(){
  setHeader('More','Settings','Sound, coloring mode & data', true);
  contentEl.innerHTML = `<div class="section-pad"><h3 class="section-title">Preferences</h3><div class="list-group"><div class="list-row"><span><i class="fas fa-volume-up"></i> &nbsp; Sound effects</span><div class="switch ${state.settings.sound?'on':''}" id="soundSwitch"></div></div><div class="list-row"><span><i class="fas fa-crosshairs"></i> &nbsp; Guided coloring by default</span><div class="switch ${state.settings.guided?'on':''}" id="guidedSwitch"></div></div></div><h3 class="section-title">Data</h3><div class="list-group"><div class="list-row" id="resetBtn"><span style="color:#C0553D;"><i class="fas fa-trash-alt"></i> &nbsp; Reset all app data</span></div></div><div class="disclaimer">Version 2.0.0 &middot; BluePrint Studio</div></div>`;
  contentEl.querySelector('#soundSwitch').addEventListener('click', (e)=>{ state.settings.sound = !state.settings.sound; saveAll(); e.currentTarget.classList.toggle('on', state.settings.sound); SFX.tap(); });
  contentEl.querySelector('#guidedSwitch').addEventListener('click', (e)=>{ state.settings.guided = !state.settings.guided; saveAll(); e.currentTarget.classList.toggle('on', state.settings.guided); SFX.tap(); });
  contentEl.querySelector('#resetBtn').addEventListener('click', async ()=>{ if(await showConfirm('This will erase all your drawings, streaks, and achievements on this device. Continue?','<i class="fas fa-exclamation-circle"></i>','reset')){ localStorage.clear(); location.reload(); } });
}

function renderLegal(sub){
  setHeader('More','Legal','Terms, privacy & reviews', true);
  contentEl.innerHTML = `<div class="section-pad"><div class="legal-tabs"><button data-s="terms">Terms</button><button data-s="privacy">Privacy</button><button data-s="review">Review</button></div><div id="legalBody"></div></div>`;
  contentEl.querySelectorAll('.legal-tabs button').forEach(b=>{ b.classList.toggle('active', b.dataset.s===sub); b.addEventListener('click', ()=>{ SFX.nav(); goTo('more','legal', b.dataset.s); }); });
  const body = contentEl.querySelector('#legalBody');
  if(sub==='terms') body.innerHTML = legalTermsHTML();
  else if(sub==='privacy') body.innerHTML = legalPrivacyHTML();
  else body.innerHTML = legalReviewHTML();
  if(sub==='privacy'){ const cb = contentEl.querySelector('#consentCheck'); cb.checked = !!state.consent; cb.addEventListener('change', ()=>{ state.consent = cb.checked ? {given:true, date:new Date().toISOString()} : null; saveAll(); toast(cb.checked ? 'Consent recorded' : 'Consent withdrawn'); }); }
  if(sub==='review'){ let stars = 0; const starEls = contentEl.querySelectorAll('.star'); starEls.forEach(s=>{ s.addEventListener('click', ()=>{ stars = Number(s.dataset.v); SFX.tap(); starEls.forEach(x=>x.classList.toggle('filled', Number(x.dataset.v)<=stars)); }); }); contentEl.querySelector('#submitReview').addEventListener('click', ()=>{ if(stars===0){ toast('Pick a star rating first'); return; } const comment = contentEl.querySelector('#reviewText').value.trim(); state.reviews.unshift({stars, comment, date:todayStr()}); saveAll(); SFX.save(); toast('Thanks for the review!'); goTo('more','legal','review'); }); }
}
function legalTermsHTML(){ return `<div class="legal-body"><h4>Terms of Use</h4><p>By using BluePrint Studio you agree to use the app for personal, non-commercial creative enjoyment. Drawings, designs and sketches you create belong to you.</p><h4>Acceptable use</h4><p>Don't attempt to disrupt the app, extract other users' data, or use the app in a way that could harm others. This app stores data only on your own device.</p><h4>No warranty</h4><p>The app is provided "as is" without warranties of any kind. Features, templates and rewards may change over time.</p><div class="disclaimer">Sample terms for demonstration purposes.</div></div>`; }
function legalPrivacyHTML(){ return `<div class="legal-body"><h4>What we store</h4><p>Your drawings, streak history, achievement progress and settings are stored locally on your device only. This prototype does not send data to a server.</p><h4>Your choice</h4><p>You can clear all local data at any time from Settings &rarr; Reset all app data.</p><div class="consent-box"><input type="checkbox" id="consentCheck"><label for="consentCheck">I understand and consent to BluePrint Studio storing my drawings and activity locally on this device.</label></div><div class="disclaimer">Sample privacy notice for demonstration.</div></div>`; }
function legalReviewHTML(){ const avg = state.reviews.length ? (state.reviews.reduce((s,r)=>s+r.stars,0)/state.reviews.length).toFixed(1) : '&mdash;'; return `<div class="legal-body"><h4>Rate BluePrint Studio</h4><div class="star-row">${[1,2,3,4,5].map(v=>`<span class="star" data-v="${v}">&#9733;</span>`).join('')}</div><textarea class="review-input" id="reviewText" placeholder="Tell us what you think..."></textarea><button class="btn brass block" id="submitReview" style="margin-top:10px;">Submit Review</button><div style="margin-top:16px;font-size:11.5px;color:#8B876F;">Average rating on this device: <b>${avg}</b> (${state.reviews.length} review${state.reviews.length===1?'':'s'})</div><div class="disclaimer">Reviews here are stored on your device only, for demo purposes.</div></div>`; }

function boot(){
  recordVisit(); checkAchievements(); setActiveTab('draw'); render();
  document.getElementById('splash').style.opacity = '0';
  setTimeout(()=>{ document.getElementById('splash').style.display = 'none'; document.getElementById('app').classList.add('ready'); }, 500);
}
const tips = ['Sharpening pencils...','Mixing paint...','Rolling out blueprints...','Counting bricks...','Almost ready...','Adding 60+ templates...','Mixing 35 colors...'];
let tipI = 0;
const tipInterval = setInterval(()=>{ tipI = (tipI+1)%tips.length; const el = document.getElementById('loadtip'); if(el) el.textContent = tips[tipI]; }, 420);
setTimeout(()=>{ clearInterval(tipInterval); boot(); }, 1900);
</script>
</body>
</html>
